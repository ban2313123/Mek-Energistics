name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

  # P2-9: GameTest gate. Runs unit tests plus the NeoForge GameTestServer so the AE2
  # /Mekanism matrix is exercised before a build is considered releasable.
  gametest:
    name: GameTest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and GameTest server
        timeout-minutes: 20
        run: ./gradlew test runGameTestServer --no-daemon

      - name: Upload GameTest reports and run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-artifacts
          path: |
            build/reports/tests
            build/test-results/test
            run/logs/latest.log
          if-no-files-found: warn

  # P2-9: Client smoke. Would catch the P0-AE2 regression (MeSmartCableConnection vs
  # IAe2OutputHost default-method conflict) and the Productive Bees Genesis combo.
  client-smoke:
    name: Client smoke
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # runClient never exits on its own, so bound it with timeout (exit 124 is
      # expected here) and let the assertion step below decide pass/fail from the log.
      - name: Smoke run client under xvfb
        timeout-minutes: 15
        run: |
          set +e
          timeout 840 xvfb-run -a ./gradlew runClient --no-daemon
          set -e

      - name: Assert client did not crash
        run: |
          test -f run/logs/latest.log
          ! grep -Eq 'IncompatibleClassChangeError|Fatal errors|failed to start' run/logs/latest.log
