pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Without this the project name is whatever the checkout directory happens to be called, which then
// becomes the publication's artifactId. Pin it to the mod id used everywhere else.
rootProject.name = 'mekenergistics'
